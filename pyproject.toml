[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatcher-resume-parser"
version = "0.1.0"
description = "PDF, DOCX, and DOC resume ingestion extension for Universal Job Matcher Phase 3"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "jsonschema>=4.22,<5",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "reportlab>=4,<5"]

[project.scripts]
jobmatch = "jobmatcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
